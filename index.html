<style>
/* 落地页基础层：只放与皮无关的结构（重置、安装引导抽屉、提示条、应用内提示、缅文不断词）。颜色全部由各页 :root 变量给。 */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
body { margin: 0; min-height: 100%; overflow-x: hidden; }
img { max-width: 100%; display: block; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--focus, #fff); outline-offset: 3px; }

/* 缅文字形上下都比中文高，统一放宽行高，避免裁字（游戏里踩过 verticalAlign=TOP 裁缅文） */
html[data-lang="my"] body { line-height: 1.75; }
/* 缅文按空格切块，块内不断行（lp-core.js put） */
lp-nw { white-space: nowrap; }

/* 页面容器：手机全宽，桌面上居中成手机宽 */
/* overflow: clip 不会像 hidden 那样让里面的 sticky（应用内提示条）失效；老浏览器退回 hidden */
.lp-shell { position: relative; width: 100%; max-width: 480px; margin: 0 auto; min-height: 100vh; overflow: hidden; overflow: clip; isolation: isolate; }

/* 安装引导：点下载后从底部升起的抽屉 */
.lp-sheet { position: fixed; inset: 0; z-index: 50; display: grid; align-items: end; justify-items: center; }
.lp-sheet__scrim { position: absolute; inset: 0; background: var(--scrim, rgba(0, 0, 0, .66)); opacity: 0; transition: opacity .22s; }
.lp-sheet__panel { position: relative; width: 100%; max-width: 480px; max-height: 92vh; overflow-y: auto; transform: translateY(100%); transition: transform .32s cubic-bezier(.2, .8, .2, 1);
  padding-bottom: env(safe-area-inset-bottom, 0px); }
.lp-sheet.is-open .lp-sheet__scrim { opacity: 1; }
.lp-sheet.is-open .lp-sheet__panel { transform: none; }

/* 提示条（顶部，免得压住底部下载按钮） */
.lp-toast { position: fixed; left: 50%; top: calc(16px + env(safe-area-inset-top, 0px)); z-index: 80; max-width: min(88vw, 420px);
  transform: translate(-50%, -12px); opacity: 0; pointer-events: none; transition: .2s;
  padding: 10px 16px; border-radius: 10px; font-size: 13px; line-height: 1.5; text-align: center;
  background: var(--toast-bg, rgba(20, 20, 20, .92)); color: var(--toast-fg, #fff); box-shadow: 0 10px 30px rgba(0, 0, 0, .35); }
.lp-toast.is-on { opacity: 1; transform: translate(-50%, 0); }

/* 应用内浏览器提示 */
.lp-inapp { position: sticky; top: 0; z-index: 40; display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; font-size: 12.5px; line-height: 1.55; }

/* 常见问题：原生 details，不用脚本 */
.lp-faq details > summary { list-style: none; cursor: pointer; }
.lp-faq details > summary::-webkit-details-marker { display: none; }

/* 减少动画：过渡直接关掉。不能写 transition-duration: .01ms —— transition-property 默认是 all，
   那样会给所有元素都加上过渡，一屏脚本临时改高度后立刻量，量到的还是旧高度，主视觉会被压到最小 */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition: none !important; }
}

</style>
<style>
/* 天青 SLOTS CASINO · P3 缅甸风一屏 —— 蒲甘晨光：天青转金的晨空 + 热气球 + 金色佛塔 + 天青塔林剪影 + 帕道花；
   下面沉到深青：金色「အနိုင်ကြီး」、卷草角花漆牌奖池、金色下载；底栏朱漆 + 缅式锯齿金边。390x844 一屏，大图区吃掉剩余高度 */
:root {
  --paper: #f7f3e8; --mist: #ebe4f2; --celadon: #b295d0; --teal: #4b2572; --teal-deep: #331552; --night: #291043; --abyss: #1b0a2d;

  --focus: #f2bf4a; --scrim: rgba(17, 6, 29, .74); --toast-bg: #fff0b8; --toast-fg: #291043;
  --rest: 330px;
  color-scheme: light;
}

    if (extra[l]) for (var k in extra[l]) I18N[l][k] = extra[l][k];
  });

  // 演示参数也可以写在 # 后面（#lang=my&guide=1）：选稿页的试玩框用它，避免托管方吞掉查询串
  var q = new URLSearchParams(location.search);
  if (location.hash.indexOf("=") > 0) new URLSearchParams(location.hash.slice(1)).forEach(function (v, k) { if (!q.has(k)) q.set(k, v); });
  var DEMO_KEYS = ["lang", "os", "inapp", "guide", "mask", "shot"];

  // ---------------------------------------------------------------- 文案
  var lang = q.get("lang") || (/^my/i.test(navigator.language || "") ? "my" : (CFG.defaultLang || "zh"));
  if (!I18N[lang]) lang = "zh";

  function fill(s, vars) {
    return String(s).replace(/\{(\w+)\}/g, function (m, k) {
      if (vars && vars[k] != null) return vars[k];
      if (k === "brand") return CFG.brand || "";
      if (k === "size") return CFG.apkSize || "";
      if (k === "os") return CFG.minOs || "";
      return m;
    });
  }
  function t(key, vars) {
    var s = (I18N[lang] && I18N[lang][key]) != null ? I18N[lang][key] : (I18N.zh[key] != null ? I18N.zh[key] : key);
    return fill(s, vars);
  }
  /**
   * 写文案。缅文浏览器会在音节中间断行（「အ / ကောင့်」），所以缅文按空格切块、块内不断行，
   * 文案里的空格就是允许换行的位置。用自定义标签 <lp-nw>，页面里 `.xx span {display:block}` 这类样式选不到它。
   */
  function put(el, s) {
    if (lang !== "my" || !/\s/.test(s)) { el.textContent = s; return; }
    el.textContent = "";
    s.split(/(\s+)/).forEach(function (part) {
      if (!part) return;
      if (/^\s+$/.test(part)) { el.appendChild(document.createTextNode(" ")); return; }
      var sp = document.createElement("lp-nw");
      sp.textContent = part;
      el.appendChild(sp);
    });
  }
  function applyI18n(root) {
    (root || document).querySelectorAll("[data-i18n]").forEach(function (el) {
      put(el, t(el.getAttribute("data-i18n")));
    });
    (root || document).querySelectorAll("[data-i18n-aria]").forEach(function (el) {
      el.setAttribute("aria-label", t(el.getAttribute("data-i18n-aria")));
    });
    document.documentElement.lang = lang === "my" ? "my" : "zh-CN";
    document.documentElement.setAttribute("data-lang", lang);
  }

  // ---------------------------------------------------------------- 平台
  var ua = navigator.userAgent || "";
  var os = q.get("os") || (/iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) ? "ios" : (/Android/i.test(ua) ? "android" : "other"));
  // Facebook / Messenger / Instagram / Line 内置浏览器常拦 APK 下载，提示用外部浏览器打开
  var inApp = q.get("inapp") === "1" || /FBAN|FBAV|FB_IAB|FBIOS|Messenger|Instagram|Line\//i.test(ua);

  // ---------------------------------------------------------------- 复制 / 跳转
  function legacyCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;top:-1000px;opacity:0";
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, text.length);
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
    return ok;
  }
  function copyText(text) {
    // 老 Android WebView 只认 execCommand；新浏览器两条都走。必须在点击回调里同步调用。
    var ok = legacyCopy(text), T = window.LPT;
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { if (T) T.copy(ok, "ok"); }, function () { if (T) T.copy(ok, "fail"); });
    else if (T) T.copy(ok, "none");
    return ok || !!navigator.clipboard;
  }
  /** 复制给 APP 的地址：整条落地页 URL（click_id、fbclid 等投放参数原样保留，去掉演示参数） */
  function pageUrl() {
    var u = new URL(location.href);
    DEMO_KEYS.forEach(function (k) { u.searchParams.delete(k); });
    if (u.hash.indexOf("=") > 0) u.hash = "";
    return u.toString();
  }
  function go(url, demoKey) {
    if (url) setTimeout(function () { location.href = url; }, 200);
    else toast(t(demoKey));
  }

  /**
   * 下载：Android 复制地址 → 开始下载 → 弹安装引导；iOS 去网页版（h5Url 为 "" 时提示用安卓手机下载）。
   * 在 Facebook 等应用内浏览器里第一次点，先盖一层「用浏览器打开」的全屏引导（页面里放 #lpMask 才有），
   * 引导上的「仍在这里下载」带 data-download-force，直接走下载。
   */
  var maskShown = false;
  function download(e) {
    var force = e && e.currentTarget && e.currentTarget.hasAttribute && e.currentTarget.hasAttribute("data-download-force");
    var mask = document.getElementById("lpMask");
    if (force && mask) mask.setAttribute("hidden", "");
    var T = window.LPT;
    if (inApp && mask && !maskShown && !force && os !== "ios") {
      maskShown = true;
      if (T) T.click(null, "inapp_mask", e);
      copyText(pageUrl());
      mask.removeAttribute("hidden");
      if (T) T.mask("show");
      return;
    }
    if (os === "ios") {
      if (T) T.click(null, CFG.h5Url ? "ios_h5" : "ios_no_h5", e);
      if (CFG.h5Url) return go(CFG.h5Url);
      return toast(t(CFG.h5Url === "" ? "ios_no_h5" : "toast_demo_h5"));
    }
    if (T) { T.click(null, CFG.apkUrl ? "download" : "demo", e); if (force && mask && e.currentTarget && mask.contains(e.currentTarget)) T.mask("force"); }
    if (CFG.copyUrl !== false) copyText(pageUrl());
    go(CFG.apkUrl, "toast_demo_dl");
    if (T && CFG.apkUrl) T.dlStart(CFG.apkUrl, { via: "href" });
    openGuide();
  }
  function openCs() { go(CFG.csUrl, "toast_demo_cs"); }

  // ---------------------------------------------------------------- 安装引导（页面里放 #lpGuide 才有）
  function openGuide() {
    var box = document.getElementById("lpGuide");
    if (!box) return;
    if (window.LPT) window.LPT.sheet("open");
    box.hidden = false;
    requestAnimationFrame(function () { box.classList.add("is-open"); });
    var f = box.querySelector("button[data-close]");
    if (f) setTimeout(function () { f.focus({ preventScroll: true }); }, 60);
  }
  function closeGuide(e) {
    var box = document.getElementById("lpGuide");
    if (!box || box.hidden) return;
    if (window.LPT) window.LPT.sheet("close", e);
    box.classList.remove("is-open");
    setTimeout(function () { box.hidden = true; }, 220);
  }

  // ---------------------------------------------------------------- 海报数字
  /** 数字从 0 滚到配置值（千分位），只滚一次；减弱动效时直接显示。el 里的文字会被替换。 */
  function roll(el, target, dur) {
    var to = Number(String(target).replace(/[^0-9]/g, "")) || 0;
    var fmt = function (n) { return Math.round(n).toLocaleString("en-US"); };
    if (LP_reduced || !window.requestAnimationFrame) { el.textContent = fmt(to); return; }
    var t0 = null; dur = dur || 1800;
    function step(ts) {
      if (t0 == null) t0 = ts;
      var k = Math.min(1, (ts - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      el.textContent = fmt(to * e);
      if (k < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }
  var LP_reduced = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);

  // ---------------------------------------------------------------- 提示条
  var toastEl, toastTimer;
  function toast(msg) {
    if (!toastEl) {
      toastEl = document.createElement("div");
      toastEl.className = "lp-toast";
      toastEl.setAttribute("role", "status");
      document.body.appendChild(toastEl);
    }
    put(toastEl, msg);
    toastEl.classList.add("is-on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("is-on"); }, 2200);
  }

  // ---------------------------------------------------------------- 绑定
  function bind() {
    applyI18n();
    document.documentElement.setAttribute("data-os", os);
    document.querySelectorAll("[data-download], [data-download-force]").forEach(function (b) { b.addEventListener("click", download); });
    document.querySelectorAll("[data-cs]").forEach(function (b) { b.addEventListener("click", openCs); });
    document.querySelectorAll("[data-close]").forEach(function (b) { b.addEventListener("click", closeGuide); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeGuide(); });
    // iOS 装不了 APK：安卓专属内容（安装步骤、APK 大小等）隐藏，下载按钮换成「进入网页版」
    // 用属性而不是 el.hidden：SVG 元素没有 hidden 属性（只是挂个 JS 字段），base.css 的 [hidden] 规则靠属性生效
    document.querySelectorAll("[data-only=android]").forEach(function (el) { if (os === "ios") el.setAttribute("hidden", ""); });
    document.querySelectorAll("[data-only=ios]").forEach(function (el) { if (os !== "ios") el.setAttribute("hidden", ""); });
    if (os === "ios") document.querySelectorAll("[data-dl-label]").forEach(function (el) { put(el, t(CFG.h5Url === "" ? "ios_no_h5_btn" : "ios_btn")); });
    var ia = document.querySelector("[data-inapp]");
    if (ia) { if (inApp) ia.removeAttribute("hidden"); else ia.setAttribute("hidden", ""); }
    if (q.get("guide") === "1") setTimeout(openGuide, 50);
    if (q.get("mask") === "1") { var mk = document.getElementById("lpMask"); if (mk) mk.removeAttribute("hidden"); }
    // 下载量：配置了真实数字才显示，没配就显示「系统 · 大小」
    document.querySelectorAll("[data-downloads]").forEach(function (el) {
      put(el, CFG.downloads ? t("downloads", { n: CFG.downloads }) : t("meta_line"));
    });
    // 海报大数字：data-roll 里不写值就用 LP_CONFIG.jackpot
    document.querySelectorAll("[data-roll]").forEach(function (el) {
      var v = el.getAttribute("data-roll") || CFG.jackpot;
      if (v) roll(el, v); else el.closest("[data-roll-box]") && el.closest("[data-roll-box]").setAttribute("hidden", "");
    });
  }
  bind();

  window.LP = {
    cfg: CFG, t: t, put: put, lang: lang, os: os, inApp: inApp,
    download: download, pageUrl: pageUrl, openGuide: openGuide, closeGuide: closeGuide, roll: roll,
    toast: toast, applyI18n: applyI18n,
    reducedMotion: !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches)
  };
})();

</script>
<script>
// 一屏：量出大图区以外的内容高（--rest），让大图区正好吃掉剩下的高度；字体、图片、换行一变就重量
(function () {
  var root = document.documentElement, shell = document.querySelector(".lp-shell"), hero = document.querySelector(".hero");
  function fit() {
    var h0 = hero.style.height, m0 = shell.style.minHeight;
    hero.style.height = "300px"; shell.style.minHeight = "0";
    var rest = shell.getBoundingClientRect().height - 300;
    hero.style.height = h0; shell.style.minHeight = m0;
    if (rest > 0) root.style.setProperty("--rest", Math.ceil(rest) + "px");
  }
  fit();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  window.addEventListener("resize", fit);
  window.addEventListener("load", fit);   // 字体走缓存时 fonts.ready 会早于图片加载，等图片到位再量一次
  // 除主视觉以外的块（字体换上、图片撑开、文案换行）一变就重量；fit 只改主视觉高度，不会自己触发自己
  if (window.ResizeObserver) {
    var ro = new ResizeObserver(function () { fit(); });
    [].forEach.call(shell.children, function (el) { if (el !== hero) ro.observe(el); });
  }
  setTimeout(fit, 1200);
})();
</script>
</body>
